name: CI & Auto-Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-code:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Backend
        working-directory: Backend
        run: |
          npm install
          npm run build
          npm test
      - name: Verify Frontend
        working-directory: Frontend
        env:
          VITE_API_URL: https://codexplus.site
          VITE_SITE_URL: https://codexplus.site
          VITE_SITE_NAME: CODEX PLUS
        run: |
          npm install
          npx tsc -b
          npm run build

  deploy-vps:
    name: Deploy to codexplus.site VPS
    needs: verify-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy.sh on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /www/wwwroot/codexplus.site/deploy.sh
