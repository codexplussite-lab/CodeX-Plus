name: CI & Auto-Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-code:
    name: Build & Test (Backend + Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Backend
        working-directory: Backend
        run: |
          npm install
          npm run build
          npm test
      - name: Verify Frontend
        working-directory: Frontend
        env:
          VITE_API_URL: https://codexplus.site
          VITE_SITE_URL: https://codexplus.site
          VITE_SITE_NAME: CODEX PLUS
        run: |
          npm install
          npx tsc -b
          npm run build

  deploy-vps:
    name: Deploy to codexplus.site VPS
    needs: verify-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          CLEAN_USER=$(printf "%s" "${VPS_USER:-root}" | tr -d '\r\n ')
          CLEAN_HOST=$(printf "%s" "${VPS_HOST}" | tr -d '\r\n ')
          mkdir -p ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${CLEAN_USER}@${CLEAN_HOST}" "bash /www/wwwroot/codexplus.site/deploy.sh"
